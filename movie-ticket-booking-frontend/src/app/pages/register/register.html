<h2>Register</h2>

<form (ngSubmit)="register()">

  <div>
    <label>Name</label>
    <input
      type="text"
      name="name"
      [(ngModel)]="name"
      required
      maxlength="100"
    >
  </div>

  <div>
    <label>Email</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
    >
  </div>

  <div>
    <label>Password</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      required
      minlength="8"
    >
  </div>

  <div>
    <label>Phone</label>
    <input
      type="tel"
      name="phone"
      [(ngModel)]="phone"
      required
    >
  </div>

  <button type="submit">Register</button>

</form>
